      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#101b33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6ee7ff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="80" y="70" width="1040" height="490" rx="28" fill="#0f172a" opacity="0.82" stroke="#23304a"/>

  <text x="120" y="155" fill="#e5e7eb" font-size="46" font-family="PingFang SC, Microsoft YaHei, Arial" font-weight="700">
